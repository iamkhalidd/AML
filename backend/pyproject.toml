[project]
name = "aml"
version = "0.1.0"
description = "Cloud AML platform for Nigerian MFBs and fintechs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security checks
  "DTZ",           # timezone-aware datetimes only (ADR-013)
  "SIM", "RUF", "PT", "N", "C4",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/aml", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=aml --cov-report=term-missing --cov-report=xml"
filterwarnings = ["error"]
markers = [
  "requirement(id): links a test to a PRD requirement ID",
]

[tool.coverage.run]
branch = true
source = ["aml"]
