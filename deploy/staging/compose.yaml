# Staging stack: same layout as one production institution (infrastructure plan).
# Only the edge proxy publishes ports; the app and database sit on a private network.
name: aml-staging

services:
  edge:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AML_DOMAIN: ${AML_DOMAIN:?set AML_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${AML_IMAGE:?set AML_IMAGE in .env}
    restart: unless-stopped
    environment:
      AML_ENVIRONMENT: staging
      AML_DATABASE_URL: postgresql://aml_app:${AML_APP_DB_PASSWORD}@db:5432/aml_control
      AML_MFA_KEY: ${AML_MFA_KEY:?set AML_MFA_KEY in .env}
    volumes:
      - tenant-secrets:/var/lib/aml/secrets:ro
    networks: [edge, private]
    depends_on:
      db:
        condition: service_healthy

  # Operator commands, run on demand only:
  #   docker compose run --rm ops migrate
  #   docker compose run --rm ops tenant create <slug> --name "<legal name>"
  ops:
    image: ${AML_IMAGE:?set AML_IMAGE in .env}
    profiles: [ops]
    entrypoint: ["aml"]
    environment:
      AML_ENVIRONMENT: staging
      AML_OPERATOR: ${AML_OPERATOR:-staging-operator}
      AML_DATABASE_URL: postgresql://aml_app:${AML_APP_DB_PASSWORD}@db:5432/aml_control
      AML_MFA_KEY: ${AML_MFA_KEY:?set AML_MFA_KEY in .env}
      AML_ADMIN_DATABASE_URL: postgresql://aml_provisioner:${AML_PROVISIONER_DB_PASSWORD}@db:5432/postgres
    volumes:
      - tenant-secrets:/var/lib/aml/secrets
    networks: [private]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # The superuser stays inside the container; the app and the CLI use the
      # non-superuser roles created by initdb/01-roles.sh on first start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
      AML_APP_DB_PASSWORD: ${AML_APP_DB_PASSWORD:?set AML_APP_DB_PASSWORD in .env}
      AML_PROVISIONER_DB_PASSWORD: ${AML_PROVISIONER_DB_PASSWORD:?set AML_PROVISIONER_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml_control"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
  private:
    internal: true

volumes:
  tenant-secrets:
  caddy-data:
  caddy-config:
  db-data:
